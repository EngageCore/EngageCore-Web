server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA history-mode routing: unknown paths fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API so the browser never sees a cross-origin or mixed-content
    # request. engage-service resolves over the engage-net docker network.
    location ^~ /api/ {
        proxy_pass http://engage-service:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Wheel/mission/tier images are served by the API off /uploads.
    # ^~ is required. Without it the regex location below (which matches
    # .png/.jpg/...) takes precedence over this prefix location, and nginx
    # tries to serve /uploads/tiers/*.png from the local html root instead
    # of proxying -- every tier image 404'd on the member portal.
    location ^~ /uploads/ {
        proxy_pass http://engage-service:3000/uploads/;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
